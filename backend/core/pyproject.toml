[project]
name = "b3core"
version = "0.0.0"
description = "Pure domain, engine and optimizer. No I/O frameworks."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b3core"]

[tool.mypy]
strict = true
