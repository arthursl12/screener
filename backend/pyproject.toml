[project]
name = "b3-backtester"
version = "0.0.0"
description = "Notebook-first B3 backtester. Educational, not investment advice."
requires-python = ">=3.12,<3.13"
dependencies = ["b3core", "b3report"]

[dependency-groups]
dev = [
    "hypothesis",
    "jupyterlab",
    "kaleido>=1.5.0",
    "mypy",
    "nbstripout",
    "pandas-stubs>=3.0.5.260914",
    "pytest",
    "ruff",
    "tqdm>=4.70.1",
]
ifr2 = [
    "scikit-learn>=1.9.1",
    "ta-lib>=0.8.2",
    "yfinance>=1.7.0",
]

[tool.uv.workspace]
members = ["core", "report"]

[tool.uv.sources]
b3core = { workspace = true }
b3report = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["core/tests", "report/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"

[tool.ruff.lint.isort]
known-first-party = ["b3core", "b3report"]
