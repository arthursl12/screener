[project]
name = "b3report"
version = "0.0.0"
description = "Plotly charts and tables for notebooks."
requires-python = ">=3.12,<3.13"
dependencies = ["b3core", "plotly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b3report"]

[tool.uv.sources]
b3core = { workspace = true }
